<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>*{box-sizing:border-box}:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Свой курс</title>
<meta name="apple-mobile-web-app-title" content="Свой курс">
<meta name="theme-color" content="#0f1424">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap">
</head>
<body>
<style>
  /* Layout: one phone screen — rate chip on top, two currency rows, quick-price chips, keypad pinned to the bottom. */
  :root {
    --bg: #0f1424;
    --surface: #182038;
    --surface-2: #222c4a;
    --line: #2b365a;
    --fg: #eef1fa;
    --muted: #8d97b8;
    --accent: #e9b949;
    --accent-ink: #1b1505;
    --key: #161d33;
    --key-press: #26304f;
    --font-display: "Unbounded", "Onest", system-ui, sans-serif;
    --font-body: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f3f4f9; --surface: #ffffff; --surface-2: #e7eaf5; --line: #d6dbeb;
      --fg: #141a2e; --muted: #626c8c; --accent: #b8860b; --accent-ink: #ffffff;
      --key: #ffffff; --key-press: #e2e6f3; color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #f3f4f9; --surface: #ffffff; --surface-2: #e7eaf5; --line: #d6dbeb;
    --fg: #141a2e; --muted: #626c8c; --accent: #b8860b; --accent-ink: #ffffff;
    --key: #ffffff; --key-press: #e2e6f3; color-scheme: light;
  }

  html, body { height: 100%; }
  html { background: var(--bg); }
  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--font-body); font-size: 15px;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
  }
  .app {
    height: 100%; max-width: 480px; margin: 0 auto;
    display: flex; flex-direction: column; gap: 12px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px;
    box-sizing: border-box;
  }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; margin: 0; letter-spacing: 0.01em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rate-chip {
    font: inherit; font-weight: 500; color: var(--fg); cursor: pointer; flex: none;
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 14px; display: flex; align-items: center; gap: 6px;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .rate-chip b { color: var(--accent); font-weight: 600; }
  .rate-chip svg { width: 14px; height: 14px; stroke: var(--muted); margin-left: 2px; }

  .settings {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    padding: 14px; display: grid; gap: 12px;
  }
  .settings h2 { font-size: 0.95rem; font-weight: 600; margin: 0; }
  .field { display: grid; gap: 6px; }
  .field label, .settings .note { color: var(--muted); font-size: 0.82rem; line-height: 1.4; margin: 0; }
  .pair { display: grid; gap: 6px; }
  .pair .icon-btn { justify-self: center; height: 36px; }
  .settings select, .settings input {
    width: 100%; min-width: 0; font: inherit; font-size: 1rem; color: var(--fg);
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 10px; user-select: text; -webkit-user-select: text;
  }
  .settings input { font-size: 1.15rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .icon-btn {
    font: inherit; color: var(--accent); background: var(--surface-2); cursor: pointer;
    border: 1px solid var(--line); border-radius: 10px; width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
  }
  .icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .rate-line { display: flex; align-items: center; gap: 8px; }
  .rate-line span { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .actions { display: flex; gap: 8px; }
  .actions button {
    flex: 1; font: inherit; font-weight: 600; border-radius: 10px; padding: 12px 16px; cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: var(--accent-ink); border: 0; }
  .btn-primary:disabled { opacity: 0.45; cursor: default; }
  .btn-ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }

  .rows { display: grid; gap: 8px; }
  .row {
    display: flex; align-items: center; gap: 12px; cursor: pointer;
    background: var(--surface); border: 1px solid transparent; border-radius: 18px;
    padding: 14px 16px; text-align: left; font: inherit; color: inherit; width: 100%;
  }
  .row.active { border-color: var(--accent); background: var(--surface-2); }
  .flag { font-size: 30px; line-height: 1; flex: none; width: 36px; text-align: center; }
  .code { font-weight: 600; font-size: 1.05rem; flex: none; }
  .code small { display: block; color: var(--muted); font-weight: 400; font-size: 0.78rem; margin-top: 2px; white-space: nowrap; }
  .value {
    flex: 1; text-align: right; min-width: 0; overflow: hidden;
    font-family: var(--font-display); font-weight: 500;
    font-size: clamp(1.4rem, 7.5vw, 2rem);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .value .expr { display: block; font-family: var(--font-body); font-size: 0.8rem; color: var(--muted); font-weight: 400; min-height: 1em; }
  .row.active .value .num::after {
    content: ""; display: inline-block; width: 2px; height: 0.9em; margin-left: 3px;
    background: var(--accent); vertical-align: -0.08em; animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .row.active .value .num::after { animation: none; } }

  .quick { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .quick::-webkit-scrollbar { display: none; }
  .quick button {
    flex: none; font: inherit; font-size: 0.85rem; color: var(--muted); cursor: pointer;
    background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px;
    font-variant-numeric: tabular-nums;
  }
  .quick button b { color: var(--fg); font-weight: 500; }

  .pad {
    margin-top: auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  }
  .pad button {
    font: inherit; font-size: 1.6rem; font-weight: 400; color: var(--fg); cursor: pointer;
    background: var(--key); border: 1px solid var(--line); border-radius: 16px;
    height: clamp(54px, 9.5vh, 72px); touch-action: manipulation;
    display: flex; align-items: center; justify-content: center;
  }
  .pad button:active { background: var(--key-press); }
  .pad .op { color: var(--accent); font-size: 1.4rem; }
  .pad .clear { font-size: 1rem; font-weight: 600; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .pad .clear:active { background: var(--accent); opacity: 0.8; }
  .pad svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  .app.editing .quick, .app.editing .pad { display: none; }

  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>

<div class="app" id="app">
  <header>
    <h1 id="title">Бат ⇄ Рубль</h1>
    <button class="rate-chip" id="rateChip" type="button" aria-label="Настроить валюты и курс">
      <span id="rateLabel">1 ฿ = <b>2,78</b> ₽</span>
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>
    </button>
  </header>

  <form class="settings" id="settings" hidden>
    <h2>Валюты и курс</h2>
    <div class="pair">
      <div class="field">
        <label for="curA">Местная валюта</label>
        <select id="curA"></select>
      </div>
      <button class="icon-btn" id="swapCur" type="button" aria-label="Поменять валюты местами"><svg viewBox="0 0 24 24"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/></svg></button>
      <div class="field">
        <label for="curB">Ваша валюта</label>
        <select id="curB"></select>
      </div>
    </div>
    <div class="field">
      <label for="rateAB">Курс, по которому вы меняли. Заполните любое из двух полей.</label>
      <div class="rate-line"><span id="labelAB">1 THB =</span><input id="rateAB" type="text" inputmode="decimal" autocomplete="off"><span id="unitAB">RUB</span></div>
      <div class="rate-line"><span id="labelBA">1 RUB =</span><input id="rateBA" type="text" inputmode="decimal" autocomplete="off" aria-label="Обратный курс"><span id="unitBA">THB</span></div>
    </div>
    <p class="note" id="rateNote"></p>
    <div class="actions">
      <button class="btn-ghost" id="cancel" type="button">Отмена</button>
      <button class="btn-primary" id="save" type="submit">Сохранить</button>
    </div>
  </form>

  <div class="rows">
    <button class="row active" id="row-a" type="button" data-side="a">
      <span class="flag" id="flag-a" aria-hidden="true"></span>
      <span class="code"><span id="code-a"></span><small id="name-a"></small></span>
      <span class="value"><span class="expr" id="expr-a"></span><span class="num" id="val-a">0</span></span>
    </button>
    <button class="row" id="row-b" type="button" data-side="b">
      <span class="flag" id="flag-b" aria-hidden="true"></span>
      <span class="code"><span id="code-b"></span><small id="name-b"></small></span>
      <span class="value"><span class="expr" id="expr-b"></span><span class="num" id="val-b">0</span></span>
    </button>
  </div>

  <div class="quick" id="quick" aria-label="Быстрые цены"></div>

  <div class="pad" id="pad">
    <button type="button" data-k="7">7</button>
    <button type="button" data-k="8">8</button>
    <button type="button" data-k="9">9</button>
    <button type="button" data-k="back" class="op" aria-label="Стереть"><svg viewBox="0 0 24 24"><path d="M9 5h11v14H9l-6-7z"/><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"/></svg></button>
    <button type="button" data-k="4">4</button>
    <button type="button" data-k="5">5</button>
    <button type="button" data-k="6">6</button>
    <button type="button" data-k="+" class="op" aria-label="Плюс">+</button>
    <button type="button" data-k="1">1</button>
    <button type="button" data-k="2">2</button>
    <button type="button" data-k="3">3</button>
    <button type="button" data-k="*" class="op" aria-label="Умножить">×</button>
    <button type="button" data-k=",">,</button>
    <button type="button" data-k="0">0</button>
    <button type="button" data-k="swap" class="op" aria-label="Поменять направление"><svg viewBox="0 0 24 24"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/></svg></button>
    <button type="button" data-k="clear" class="clear" aria-label="Сбросить до нуля">Сброс</button>
  </div>
</div>

<script>
(function () {
  // code: [full name, short name, symbol, flag, typical small price]
  var CURRENCIES = {
    AED: ["Дирхам ОАЭ", "Дирхам", "AED", "🇦🇪", 5],
    AMD: ["Армянский драм", "Драм", "֏", "🇦🇲", 500],
    ARS: ["Аргентинское песо", "Песо", "$", "🇦🇷", 1000],
    AZN: ["Азербайджанский манат", "Манат", "₼", "🇦🇿", 1],
    BRL: ["Бразильский реал", "Реал", "R$", "🇧🇷", 5],
    BYN: ["Белорусский рубль", "Бел. рубль", "Br", "🇧🇾", 2],
    CHF: ["Швейцарский франк", "Франк", "Fr", "🇨🇭", 1],
    CNY: ["Китайский юань", "Юань", "¥", "🇨🇳", 10],
    EGP: ["Египетский фунт", "Фунт", "E£", "🇪🇬", 50],
    EUR: ["Евро", "Евро", "€", "🇪🇺", 1],
    GBP: ["Фунт стерлингов", "Фунт", "£", "🇬🇧", 1],
    GEL: ["Грузинский лари", "Лари", "₾", "🇬🇪", 2],
    IDR: ["Индонезийская рупия", "Рупия", "Rp", "🇮🇩", 10000],
    ILS: ["Израильский шекель", "Шекель", "₪", "🇮🇱", 5],
    INR: ["Индийская рупия", "Рупия", "₹", "🇮🇳", 50],
    JPY: ["Японская иена", "Иена", "¥", "🇯🇵", 100],
    KGS: ["Киргизский сом", "Сом", "сом", "🇰🇬", 100],
    KHR: ["Камбоджийский риель", "Риель", "៛", "🇰🇭", 4000],
    KRW: ["Южнокорейская вона", "Вона", "₩", "🇰🇷", 1000],
    KZT: ["Казахстанский тенге", "Тенге", "₸", "🇰🇿", 500],
    LAK: ["Лаосский кип", "Кип", "₭", "🇱🇦", 10000],
    LKR: ["Шри-ланкийская рупия", "Рупия", "Rs", "🇱🇰", 200],
    MNT: ["Монгольский тугрик", "Тугрик", "₮", "🇲🇳", 2000],
    MVR: ["Мальдивская руфия", "Руфия", "Rf", "🇲🇻", 20],
    MXN: ["Мексиканское песо", "Песо", "$", "🇲🇽", 20],
    MYR: ["Малайзийский ринггит", "Ринггит", "RM", "🇲🇾", 5],
    NPR: ["Непальская рупия", "Рупия", "Rs", "🇳🇵", 100],
    PHP: ["Филиппинское песо", "Песо", "₱", "🇵🇭", 50],
    RSD: ["Сербский динар", "Динар", "дин", "🇷🇸", 100],
    RUB: ["Российский рубль", "Рубль", "₽", "🇷🇺", 100],
    THB: ["Тайский бат", "Бат", "฿", "🇹🇭", 20],
    TRY: ["Турецкая лира", "Лира", "₺", "🇹🇷", 20],
    UAH: ["Украинская гривна", "Гривна", "₴", "🇺🇦", 20],
    USD: ["Доллар США", "Доллар", "$", "🇺🇸", 1],
    UZS: ["Узбекский сум", "Сум", "сўм", "🇺🇿", 10000],
    VND: ["Вьетнамский донг", "Донг", "₫", "🇻🇳", 10000]
  };
  var QUICK_STEPS = [1, 2.5, 5, 10, 25, 50, 100];

  // cfg.rate = how many units of B one unit of A costs
  var cfg = { a: "THB", b: "RUB", rate: 2.78 };
  try {
    var savedCfg = JSON.parse(localStorage.getItem("fxCfg") || "null");
    if (savedCfg && CURRENCIES[savedCfg.a] && CURRENCIES[savedCfg.b] && savedCfg.rate > 0) cfg = savedCfg;
    else {
      var oldRate = parseFloat(localStorage.getItem("thbRubRate"));   // rate saved by the first version
      if (oldRate > 0) cfg.rate = oldRate;
    }
  } catch (e) {}

  var active = "a";        // which row is being typed into
  var input = "";          // expression typed in the active row, e.g. "120+45*2"
  var fresh = true;        // next digit starts a new number instead of appending
  try { var savedSide = localStorage.getItem("fxSide"); if (savedSide === "b") active = "b"; } catch (e) {}
  input = String(CURRENCIES[cfg[active]][4] * 5);

  var $ = function (id) { return document.getElementById(id); };
  var fmt = function (n, maxFrac) {
    return n.toLocaleString("ru-RU", { maximumFractionDigits: maxFrac, minimumFractionDigits: 0 });
  };
  // Money: no kopecks on big sums, a few significant digits on tiny ones.
  function fmtMoney(v) {
    if (v === 0) return "0";
    if (v >= 1000) return fmt(v, 0);
    if (v >= 1) return fmt(v, 2);
    return v.toLocaleString("ru-RU", { maximumSignificantDigits: 3 });
  }
  function fmtShort(v) {
    if (v >= 100) return fmt(v, 0);
    if (v >= 1) return fmt(v, 1);
    return v.toLocaleString("ru-RU", { maximumSignificantDigits: 2 });
  }
  function fmtRate(v) {
    if (v >= 100) return fmt(v, 2);
    if (v >= 1) return fmt(v, 4);
    return v.toLocaleString("ru-RU", { maximumSignificantDigits: 4 });
  }
  function parseNum(s) { return parseFloat(String(s).replace(/\s/g, "").replace(",", ".")); }
  function cur(side) { return CURRENCIES[cfg[side]]; }
  function convert(amount, from) { return from === "a" ? amount * cfg.rate : amount / cfg.rate; }
  function saveCfg() { try { localStorage.setItem("fxCfg", JSON.stringify(cfg)); } catch (e) {} }

  // Evaluate "a+b*c" with × before +. An unfinished tail like "5+" or "5*" is ignored.
  function evaluate(expr) {
    return expr.split("+").reduce(function (sum, term) {
      var factors = term.split("*").map(parseFloat).filter(function (f) { return !isNaN(f); });
      return factors.length ? sum + factors.reduce(function (p, f) { return p * f; }, 1) : sum;
    }, 0);
  }
  function hasOp(s) { return /[+*]/.test(s); }
  function prettyExpr(s) {
    return s.replace(/\*/g, " × ").replace(/\+/g, " + ").replace(/\./g, ",");
  }
  function prettyInput(s) {
    // the last number being typed, formatted with thousands spaces but keeping a trailing comma/zeros
    var last = s.split(/[+*]/).pop();
    if (last === "") return "";
    var parts = last.split(".");
    var intPart = parts[0] === "" ? "0" : Number(parts[0]).toLocaleString("ru-RU");
    return parts.length > 1 ? intPart + "," + parts[1] : intPart;
  }

  function renderCurrencies() {
    ["a", "b"].forEach(function (side) {
      var c = cur(side);
      $("flag-" + side).textContent = c[3];
      $("code-" + side).textContent = cfg[side];
      $("name-" + side).textContent = c[1] + " " + c[2];
    });
    $("title").textContent = cur("a")[1] + " ⇄ " + cur("b")[1];
    // show the direction where the number is at least 1, e.g. "1 ₽ = 278 ₫" rather than "1 ₫ = 0,0036 ₽"
    var symA = cur("a")[2], symB = cur("b")[2];
    $("rateLabel").innerHTML = cfg.rate >= 1
      ? "1 " + symA + " = <b>" + fmtRate(cfg.rate) + "</b> " + symB
      : "1 " + symB + " = <b>" + fmtRate(1 / cfg.rate) + "</b> " + symA;
  }

  function render() {
    var other = active === "a" ? "b" : "a";
    var amount = evaluate(input || "0");

    $("row-" + active).classList.add("active");
    $("row-" + other).classList.remove("active");

    $("val-" + active).textContent = hasOp(input) ? fmtMoney(amount) : prettyInput(input) || "0";
    $("expr-" + active).textContent = hasOp(input) ? prettyExpr(input) : "";
    $("val-" + other).textContent = fmtMoney(convert(amount, active));
    $("expr-" + other).textContent = "";

    renderCurrencies();
    renderQuick();
    fitValues();
  }

  // Shrink a long number so it stays on one line.
  function fitValues() {
    document.querySelectorAll(".value").forEach(function (box) {
      var num = box.querySelector(".num");
      num.style.fontSize = "";
      if (num.scrollWidth > box.clientWidth) {
        num.style.fontSize = (box.clientWidth / num.scrollWidth * 0.97) + "em";
      }
    });
  }
  window.addEventListener("resize", fitValues);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitValues);

  function renderQuick() {
    var q = $("quick");
    var other = active === "a" ? "b" : "a";
    var base = cur(active)[4];
    var from = " " + cur(active)[2], to = " " + cur(other)[2];
    q.innerHTML = "";
    QUICK_STEPS.forEach(function (step) {
      var a = base * step;
      var b = document.createElement("button");
      b.type = "button";
      b.innerHTML = "<b>" + fmt(a, 2) + from + "</b> = " + fmtShort(convert(a, active)) + to;
      b.addEventListener("click", function () { input = String(a); fresh = true; render(); });
      q.appendChild(b);
    });
  }

  function press(k) {
    if (fresh && (/^\d$/.test(k) || k === "," || k === ".")) input = "";
    fresh = false;
    if (k === "clear") { input = ""; }
    else if (k === "back") { input = input.slice(0, -1); }
    else if (k === "swap") { switchTo(active === "a" ? "b" : "a"); return; }
    else if (k === "+" || k === "*") {
      if (input === "") return;
      if (/[+*]$/.test(input)) input = input.slice(0, -1);
      if (/\.$/.test(input)) input = input.slice(0, -1);
      input += k;
    }
    else if (k === "," || k === ".") {
      var last = input.split(/[+*]/).pop();
      if (last.indexOf(".") !== -1) return;
      input += last === "" ? "0." : ".";
    }
    else if (/^\d$/.test(k)) {
      var curNum = input.split(/[+*]/).pop();
      if (curNum === "0") input = input.slice(0, -1);     // no leading zeros
      var frac = curNum.split(".")[1];
      if (frac !== undefined && frac.length >= 2) return;
      if (curNum.replace(".", "").length >= 10) return;
      input += k;
    }
    render();
  }

  function switchTo(side) {
    if (side === active) return;
    // carry the converted amount over so the other row becomes editable from the same value
    var converted = convert(evaluate(input || "0"), active);
    active = side;
    input = converted ? String(Math.round(converted * 100) / 100) : "";
    fresh = true;
    try { localStorage.setItem("fxSide", active); } catch (e) {}
    render();
  }

  document.querySelectorAll(".row").forEach(function (row) {
    row.addEventListener("click", function () { switchTo(row.dataset.side); });
  });
  $("pad").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (b) press(b.dataset.k);
  });

  // Settings: currencies and rate
  var settings = $("settings"), selA = $("curA"), selB = $("curB"), inAB = $("rateAB"), inBA = $("rateBA");
  var codes = Object.keys(CURRENCIES).sort(function (x, y) { return CURRENCIES[x][0].localeCompare(CURRENCIES[y][0], "ru"); });
  [selA, selB].forEach(function (sel) {
    codes.forEach(function (code) {
      var o = document.createElement("option");
      o.value = code;
      o.textContent = CURRENCIES[code][3] + " " + code + " · " + CURRENCIES[code][0];
      sel.appendChild(o);
    });
  });

  function draftLabels() {
    var a = selA.value, b = selB.value;
    $("labelAB").textContent = "1 " + a + " =";
    $("unitAB").textContent = b;
    $("labelBA").textContent = "1 " + b + " =";
    $("unitBA").textContent = a;
  }
  function draftCheck() {
    var r = typedReverse ? 1 / parseNum(inBA.value) : parseNum(inAB.value);
    var same = selA.value === selB.value;
    var sample = CURRENCIES[selA.value][4] * 5;
    $("save").disabled = !(r > 0) || same;
    $("rateNote").textContent = same ? "Выберите две разные валюты."
      : r > 0 ? "Например, " + fmt(sample, 2) + " " + selA.value + " = " + fmtMoney(sample * r) + " " + selB.value + "."
      : "Впишите курс, чтобы сохранить.";
  }
  function openSettings() {
    selA.value = cfg.a; selB.value = cfg.b;
    inAB.value = fmtRate(cfg.rate).replace(/\s/g, "");
    inBA.value = fmtRate(1 / cfg.rate).replace(/\s/g, "");
    typedReverse = false;
    draftLabels(); draftCheck();
    settings.hidden = false;
    $("app").classList.add("editing");
  }
  function closeSettings() {
    settings.hidden = true;
    $("app").classList.remove("editing");
  }
  $("rateChip").addEventListener("click", function () { settings.hidden ? openSettings() : closeSettings(); });
  $("cancel").addEventListener("click", closeSettings);

  // The two rate fields mirror each other: typing one fills in the other.
  var typedReverse = false;   // the rate was typed as "1 B = ? A", keep its exact value
  inAB.addEventListener("input", function () {
    typedReverse = false;
    var r = parseNum(inAB.value);
    inBA.value = r > 0 ? fmtRate(1 / r).replace(/\s/g, "") : "";
    draftCheck();
  });
  inBA.addEventListener("input", function () {
    typedReverse = true;
    var r = parseNum(inBA.value);
    inAB.value = r > 0 ? fmtRate(1 / r).replace(/\s/g, "") : "";
    draftCheck();
  });
  function onCurrencyChange() {
    // a new pair needs a new rate, unless it is the saved pair or the saved pair flipped
    var a = selA.value, b = selB.value;
    var r = a === cfg.a && b === cfg.b ? cfg.rate : a === cfg.b && b === cfg.a ? 1 / cfg.rate : 0;
    inAB.value = r ? fmtRate(r).replace(/\s/g, "") : "";
    inBA.value = r ? fmtRate(1 / r).replace(/\s/g, "") : "";
    typedReverse = false;
    draftLabels(); draftCheck();
    if (!r) inAB.focus();
  }
  selA.addEventListener("change", onCurrencyChange);
  selB.addEventListener("change", onCurrencyChange);
  $("swapCur").addEventListener("click", function () {
    var a = selA.value; selA.value = selB.value; selB.value = a;
    var ab = inAB.value; inAB.value = inBA.value; inBA.value = ab;
    typedReverse = !typedReverse;
    draftLabels(); draftCheck();
  });

  settings.addEventListener("submit", function (e) {
    e.preventDefault();
    var r = typedReverse ? 1 / parseNum(inBA.value) : parseNum(inAB.value);
    if (!(r > 0) || selA.value === selB.value) return;
    var changed = selA.value !== cfg.a || selB.value !== cfg.b;
    cfg = { a: selA.value, b: selB.value, rate: r };
    saveCfg();
    if (changed) { input = String(cur(active)[4] * 5); fresh = true; }
    closeSettings();
    render();
  });

  // Physical keyboard on desktop
  document.addEventListener("keydown", function (e) {
    if (!settings.hidden) return;
    var map = { Backspace: "back", Escape: "clear", Delete: "clear", "x": "*", "X": "*", "Tab": "swap" };
    var k = map[e.key] || e.key;
    if (/^[\d+*.,]$/.test(k) || k === "back" || k === "clear" || k === "swap") {
      e.preventDefault(); press(k);
    }
  });

  render();
})();
</script>

</body>
</html>
