<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>*{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Бат в рубли</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap">
<style>
  /* Layout: one phone screen — rate chip on top, two currency rows, quick-price chips, keypad pinned to the bottom. */
  :root {
    --bg: #0f1424;
    --surface: #182038;
    --surface-2: #222c4a;
    --line: #2b365a;
    --fg: #eef1fa;
    --muted: #8d97b8;
    --accent: #e9b949;
    --accent-ink: #1b1505;
    --key: #161d33;
    --key-press: #26304f;
    --font-display: "Unbounded", "Onest", system-ui, sans-serif;
    --font-body: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f3f4f9; --surface: #ffffff; --surface-2: #e7eaf5; --line: #d6dbeb;
      --fg: #141a2e; --muted: #626c8c; --accent: #b8860b; --accent-ink: #ffffff;
      --key: #ffffff; --key-press: #e2e6f3; color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #f3f4f9; --surface: #ffffff; --surface-2: #e7eaf5; --line: #d6dbeb;
    --fg: #141a2e; --muted: #626c8c; --accent: #b8860b; --accent-ink: #ffffff;
    --key: #ffffff; --key-press: #e2e6f3; color-scheme: light;
  }

  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--font-body); font-size: 15px;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
  }
  .app {
    height: 100%; max-width: 480px; margin: 0 auto;
    display: flex; flex-direction: column; gap: 12px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px;
    box-sizing: border-box;
  }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; margin: 0; letter-spacing: 0.01em; }
  .rate-chip {
    font: inherit; font-weight: 500; color: var(--fg); cursor: pointer;
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 14px; display: flex; align-items: center; gap: 8px;
    font-variant-numeric: tabular-nums;
  }
  .rate-chip b { color: var(--accent); font-weight: 600; }
  .rate-chip svg { width: 14px; height: 14px; stroke: var(--muted); }

  .rate-panel {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    padding: 14px; display: grid; gap: 10px;
  }
  .rate-panel label { color: var(--muted); font-size: 0.85rem; }
  .rate-row { display: flex; gap: 8px; align-items: center; }
  .rate-row span { color: var(--muted); white-space: nowrap; }
  .rate-row input {
    flex: 1; min-width: 0; font: inherit; font-size: 1.3rem; font-weight: 600;
    background: var(--surface-2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 12px; font-variant-numeric: tabular-nums;
    user-select: text; -webkit-user-select: text;
  }
  .rate-row button {
    font: inherit; font-weight: 600; background: var(--accent); color: var(--accent-ink);
    border: 0; border-radius: 10px; padding: 11px 16px; cursor: pointer;
  }
  .rate-hint { color: var(--muted); font-size: 0.8rem; line-height: 1.4; margin: 0; }

  .rows { display: grid; gap: 8px; }
  .row {
    display: flex; align-items: center; gap: 14px; cursor: pointer;
    background: var(--surface); border: 1px solid transparent; border-radius: 18px;
    padding: 14px 16px; text-align: left; font: inherit; color: inherit; width: 100%;
  }
  .row.active { border-color: var(--accent); background: var(--surface-2); }
  .flag { width: 40px; height: 28px; border-radius: 5px; flex: none; overflow: hidden; }
  .code { font-weight: 600; font-size: 1.05rem; flex: none; }
  .code small { display: block; color: var(--muted); font-weight: 400; font-size: 0.78rem; margin-top: 2px; white-space: nowrap; }
  .value {
    flex: 1; text-align: right; min-width: 0; overflow: hidden;
    font-family: var(--font-display); font-weight: 500;
    font-size: clamp(1.4rem, 7.5vw, 2rem);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .value .expr { display: block; font-family: var(--font-body); font-size: 0.8rem; color: var(--muted); font-weight: 400; min-height: 1em; }
  .row.active .value .num::after {
    content: ""; display: inline-block; width: 2px; height: 0.9em; margin-left: 3px;
    background: var(--accent); vertical-align: -0.08em; animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .row.active .value .num::after { animation: none; } }

  .quick { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .quick::-webkit-scrollbar { display: none; }
  .quick button {
    flex: none; font: inherit; font-size: 0.85rem; color: var(--muted); cursor: pointer;
    background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px;
    font-variant-numeric: tabular-nums;
  }
  .quick button b { color: var(--fg); font-weight: 500; }

  .pad {
    margin-top: auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  }
  .pad button {
    font: inherit; font-size: 1.6rem; font-weight: 400; color: var(--fg); cursor: pointer;
    background: var(--key); border: 1px solid var(--line); border-radius: 16px;
    height: clamp(54px, 9.5vh, 72px); touch-action: manipulation;
    display: flex; align-items: center; justify-content: center;
  }
  .pad button:active, .pad button.pressed { background: var(--key-press); }
  .pad .op { color: var(--accent); font-size: 1.4rem; }
  .pad .clear { font-size: 1rem; font-weight: 600; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .pad .clear:active { background: var(--accent); opacity: 0.8; }
  .pad svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>

<div class="app">
  <header>
    <h1>Бат ⇄ Рубль</h1>
    <button class="rate-chip" id="rateChip" type="button" aria-label="Изменить курс">
      1 ฿ = <b id="rateLabel">2,78</b> ₽
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>
    </button>
  </header>

  <form class="rate-panel" id="ratePanel" hidden>
    <label for="rateInput">Курс, по которому вы меняли: сколько рублей стоит 1 бат</label>
    <div class="rate-row">
      <span>1 ฿ =</span>
      <input id="rateInput" type="text" inputmode="decimal" autocomplete="off">
      <span>₽</span>
      <button type="submit">Сохранить</button>
    </div>
    <p class="rate-hint" id="rateHint"></p>
  </form>

  <div class="rows">
    <button class="row active" id="row-thb" type="button" data-cur="thb">
      <svg class="flag" viewBox="0 0 9 6" aria-hidden="true"><rect width="9" height="6" fill="#A51931"/><rect y="1" width="9" height="4" fill="#F4F5F8"/><rect y="2" width="9" height="2" fill="#2D2A4A"/></svg>
      <span class="code">THB<small>Бат ฿</small></span>
      <span class="value"><span class="expr" id="expr-thb"></span><span class="num" id="val-thb">0</span></span>
    </button>
    <button class="row" id="row-rub" type="button" data-cur="rub">
      <svg class="flag" viewBox="0 0 9 6" aria-hidden="true"><rect width="9" height="6" fill="#fff"/><rect y="2" width="9" height="2" fill="#0039A6"/><rect y="4" width="9" height="2" fill="#D52B1E"/></svg>
      <span class="code">RUB<small>Рубль ₽</small></span>
      <span class="value"><span class="expr" id="expr-rub"></span><span class="num" id="val-rub">0</span></span>
    </button>
  </div>

  <div class="quick" id="quick" aria-label="Быстрые цены"></div>

  <div class="pad" id="pad">
    <button type="button" data-k="7">7</button>
    <button type="button" data-k="8">8</button>
    <button type="button" data-k="9">9</button>
    <button type="button" data-k="back" class="op" aria-label="Стереть"><svg viewBox="0 0 24 24"><path d="M9 5h11v14H9l-6-7z"/><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"/></svg></button>
    <button type="button" data-k="4">4</button>
    <button type="button" data-k="5">5</button>
    <button type="button" data-k="6">6</button>
    <button type="button" data-k="+" class="op" aria-label="Плюс">+</button>
    <button type="button" data-k="1">1</button>
    <button type="button" data-k="2">2</button>
    <button type="button" data-k="3">3</button>
    <button type="button" data-k="*" class="op" aria-label="Умножить">×</button>
    <button type="button" data-k=",">,</button>
    <button type="button" data-k="0">0</button>
    <button type="button" data-k="swap" class="op" aria-label="Поменять направление"><svg viewBox="0 0 24 24"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/></svg></button>
    <button type="button" data-k="clear" class="clear" aria-label="Сбросить до нуля">Сброс</button>
  </div>
</div>

<script>
(function () {
  var DEFAULT_RATE = 2.78;
  var rate = DEFAULT_RATE;
  try { var saved = parseFloat(localStorage.getItem("thbRubRate")); if (saved > 0) rate = saved; } catch (e) {}

  var active = "thb";      // which row is being typed into
  var input = "100";       // expression typed in the active row, e.g. "120+45*2"
  var fresh = true;        // next digit starts a new number instead of appending
  try { if (localStorage.getItem("thbRubDir") === "rub") active = "rub"; } catch (e) {}

  var $ = function (id) { return document.getElementById(id); };
  var fmt = function (n, maxFrac) {
    return n.toLocaleString("ru-RU", { maximumFractionDigits: maxFrac, minimumFractionDigits: 0 });
  };

  // Evaluate "a+b*c" with × before +. Only digits, one dot per number, + and *.
  function evaluate(expr) {
    // An unfinished tail like "5+" or "5*" is ignored.
    return expr.split("+").reduce(function (sum, term) {
      var factors = term.split("*").map(parseFloat).filter(function (f) { return !isNaN(f); });
      return factors.length ? sum + factors.reduce(function (p, f) { return p * f; }, 1) : sum;
    }, 0);
  }
  function hasOp(s) { return /[+*]/.test(s); }
  function prettyExpr(s) {
    return s.replace(/\*/g, " × ").replace(/\+/g, " + ").replace(/\./g, ",");
  }
  function prettyInput(s) {
    // the last number being typed, formatted with thousands spaces but keeping a trailing comma/zeros
    var last = s.split(/[+*]/).pop();
    if (last === "") return "";
    var parts = last.split(".");
    var intPart = parts[0] === "" ? "0" : Number(parts[0]).toLocaleString("ru-RU");
    return parts.length > 1 ? intPart + "," + parts[1] : intPart;
  }

  function render() {
    var other = active === "thb" ? "rub" : "thb";
    var amount = evaluate(input || "0");
    var converted = active === "thb" ? amount * rate : amount / rate;

    $("row-" + active).classList.add("active");
    $("row-" + other).classList.remove("active");

    var typed = hasOp(input) ? prettyInput(input) || fmt(amount, 2) : prettyInput(input) || "0";
    $("val-" + active).textContent = hasOp(input) ? fmt(amount, 2) : typed;
    $("expr-" + active).textContent = hasOp(input) ? prettyExpr(input) : "";
    $("val-" + other).textContent = fmt(converted, converted >= 1000 ? 0 : 2);
    $("expr-" + other).textContent = "";

    $("rateLabel").textContent = fmt(rate, 4);
    renderQuick();
    fitValues();
  }

  // Shrink a long number so it stays on one line.
  function fitValues() {
    document.querySelectorAll(".value").forEach(function (box) {
      var num = box.querySelector(".num");
      num.style.fontSize = "";
      if (num.scrollWidth > box.clientWidth) {
        num.style.fontSize = (box.clientWidth / num.scrollWidth * 0.97) + "em";
      }
    });
  }
  window.addEventListener("resize", fitValues);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitValues);

  function renderQuick() {
    var q = $("quick");
    var amounts = active === "thb" ? [20, 50, 100, 200, 500, 1000, 2000] : [100, 500, 1000, 2000, 5000, 10000];
    var from = active === "thb" ? " ฿" : " ₽";
    var to = active === "thb" ? " ₽" : " ฿";
    q.innerHTML = "";
    amounts.forEach(function (a) {
      var b = document.createElement("button");
      b.type = "button";
      var conv = active === "thb" ? a * rate : a / rate;
      b.innerHTML = "<b>" + fmt(a, 0) + from + "</b> = " + fmt(conv, conv >= 100 ? 0 : 1) + to;
      b.addEventListener("click", function () { input = String(a); fresh = true; render(); });
      q.appendChild(b);
    });
  }

  function press(k) {
    if (fresh && (/^\d$/.test(k) || k === "," || k === ".")) input = "";
    fresh = false;
    if (k === "clear") { input = ""; }
    else if (k === "back") { input = input.slice(0, -1); }
    else if (k === "swap") { switchTo(active === "thb" ? "rub" : "thb"); return; }
    else if (k === "+" || k === "*") {
      if (input === "") return;
      if (/[+*]$/.test(input)) input = input.slice(0, -1);
      if (/\.$/.test(input)) input = input.slice(0, -1);
      input += k;
    }
    else if (k === "," || k === ".") {
      var last = input.split(/[+*]/).pop();
      if (last.indexOf(".") !== -1) return;
      input += last === "" ? "0." : ".";
    }
    else if (/^\d$/.test(k)) {
      var cur = input.split(/[+*]/).pop();
      if (cur === "0") input = input.slice(0, -1);     // no leading zeros
      var frac = cur.split(".")[1];
      if (frac !== undefined && frac.length >= 2) return;
      if (cur.replace(".", "").length >= 9) return;
      input += k;
    }
    render();
  }

  function switchTo(cur) {
    if (cur === active) return;
    // carry the converted amount over so the other row becomes editable from the same value
    var amount = evaluate(input || "0");
    var converted = active === "thb" ? amount * rate : amount / rate;
    active = cur;
    input = converted ? String(Math.round(converted * 100) / 100) : "";
    fresh = true;
    try { localStorage.setItem("thbRubDir", active); } catch (e) {}
    render();
  }

  document.querySelectorAll(".row").forEach(function (row) {
    row.addEventListener("click", function () { switchTo(row.dataset.cur); });
  });
  $("pad").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (b) press(b.dataset.k);
  });

  // Rate editor
  var panel = $("ratePanel"), rateInput = $("rateInput");
  function updateHint() {
    var r = parseFloat(rateInput.value.replace(",", "."));
    $("rateHint").textContent = r > 0
      ? "Значит 1 ₽ = " + fmt(1 / r, 3) + " ฿, а 100 ฿ = " + fmt(100 * r, 0) + " ₽."
      : "Введите число, например 2,78";
  }
  $("rateChip").addEventListener("click", function () {
    panel.hidden = !panel.hidden;
    if (!panel.hidden) { rateInput.value = fmt(rate, 4).replace(/\s/g, ""); updateHint(); rateInput.focus(); rateInput.select(); }
  });
  rateInput.addEventListener("input", updateHint);
  panel.addEventListener("submit", function (e) {
    e.preventDefault();
    var r = parseFloat(rateInput.value.replace(/\s/g, "").replace(",", "."));
    if (!(r > 0)) { updateHint(); return; }
    rate = r;
    try { localStorage.setItem("thbRubRate", String(r)); } catch (err) {}
    panel.hidden = true;
    render();
  });

  // Physical keyboard on desktop
  document.addEventListener("keydown", function (e) {
    if (e.target === rateInput) return;
    var map = { Backspace: "back", Escape: "clear", Delete: "clear", "x": "*", "X": "*", "Tab": "swap" };
    var k = map[e.key] || e.key;
    if (/^[\d+*.,]$/.test(k) || k === "back" || k === "clear" || k === "swap") {
      e.preventDefault(); press(k);
    }
  });

  render();
})();
</script>

</body>
</html>
